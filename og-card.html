<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>og:image 카드 (1200×630)</title>

<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<style>
:root{
  /* index.html과 동일한 팔레트 */
  --bg:#f9f9f7;
  --text:#20211d;
  --text-muted:#717165;
  --accent:#28579e;
  --sans:'Pretendard Variable', Pretendard, -apple-system, sans-serif;
}

*{box-sizing:border-box; margin:0;}

body{
  background:#e9e9e4;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:40px;
  font-family:var(--sans);
}

/* 캡처 대상. 정확히 1200×630 */
.card{
  position:relative;
  width:1200px;
  height:630px;
  flex:none;
  overflow:hidden;
  background:var(--bg);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  /* 카톡이 목록에서 정사각형으로 자를 수 있어 여백을 넉넉히 둔다 */
  padding:0 150px;
}

/* 사이트 본문과 같은 종이 스캔라인 텍스처 */
.card::after{
  content:"";
  position:absolute; inset:0;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    rgba(0,0,0,.012) 0px, rgba(0,0,0,.012) 1px,
    transparent 1px, transparent 3px
  );
  opacity:.5;
}

.kicker{
  font-size:26px;
  font-weight:600;
  letter-spacing:.16em;
  color:var(--accent);
  margin-bottom:38px;
}

.title{
  font-size:104px;
  font-weight:800;
  line-height:1.18;
  white-space:nowrap;
  letter-spacing:-.035em;
  color:var(--text);
}
.title em{
  font-style:normal;
  color:var(--accent);
}

.sub{
  margin-top:44px;
  font-size:46px;
  font-weight:600;
  color:var(--text-muted);
  letter-spacing:-.015em;
}

/* 화면에만 보이는 안내. 캡처 영역 밖 */
.hint{
  position:fixed;
  left:0; right:0; top:0;
  padding:10px 16px;
  background:#20211d;
  color:#f9f9f7;
  font-family:var(--sans);
  font-size:13px;
  line-height:1.6;
  z-index:99;
}
.hint b{color:#7fb3f0;}

/* ?capture=1 로 열면 카드만 남는다 (headless 스크린샷용) */
body.capture{padding:0; min-height:0; display:block; background:#fff;}
body.capture .hint{display:none;}
html.capture{overflow:hidden;}
</style>
</head>
<body>
<script>
  if (location.search.indexOf('capture=1') !== -1) {
    document.documentElement.classList.add('capture');
    document.body.classList.add('capture');
  }
</script>

<div class="hint">
  캡처 대상 = <b>.card</b> (1200×630). <b>?capture=1</b> 로 열면 카드만 렌더된다.
</div>

<div class="card" id="card">
  <div class="kicker">7일 벼락치기</div>
  <h1 class="title">리눅스마스터<br><em>2급 1차</em></h1>
  <p class="sub">개념 정리 + 기출 족보 270제</p>
</div>

</body>
</html>
